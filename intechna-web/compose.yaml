# One application instance. Put an HTTPS reverse proxy in front of localhost:3000.
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the customer HTTPS domain}
      secrets:
        - database_url
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - uploads:/app/public/uploads
      - next-cache:/app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  database_url:
    file: .secrets/build-database-url

volumes:
  uploads:
  next-cache:
